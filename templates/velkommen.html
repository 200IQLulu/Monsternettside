{% extends "base.html" %}

{% block content %}
<div class="container">
  <h2>Velkommen, {{ name }}!</h2>
  <p>Du er nå logget inn.</p>
  <p>
    <a href="{{ url_for('index') }}">Tilbake til startsiden</a>
  </p>
  <div class="monster_grid">

  {% for monster in monster_liste %}
  
  <div class="monster-card">
  <a href="{{ url_for('velkommen',id=monster['id']) }}">
  <img src="{{ url_for('static', filename='images/' ~ monster['id'] ~ '.jpg')}}"
  alt="{{monster['navn'] }}">
  </a>

  <p>{{ monster["navn"] }} </p>
    
  </div>
  {% endfor %}
</div>

{% if valgt %}

<div class="container">

<h2>{{ valgt["navn"] }}</h2>

<img class="info-img"

src="{{ url_for('static',
filename='images/' ~ valgt['id'] ~ '.jpg') }}"


alt="{{ valgt['navn'] }}">

<p>{{ valgt["info"] }}</p>

</div>

{% endif %}
</div>
{% endblock %}
