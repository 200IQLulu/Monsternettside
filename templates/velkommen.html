{% extends "base.html" %}

{% block content %}
<div class="container">
  <h2>Velkommen, {{ name }}!</h2>
  <p>Du er nå logget inn.</p>
  <p>
    <a class="nav-link" href="{{ url_for('index') }}">Tilbake til startsiden</a>
  </p>
  <div class="monster-grid">

  {% for monster in monster_liste %}
  
  <div class="monster-card">
  <a href="{{ url_for('monster_info', smak=monster['navn']) }}">
  <img src="{{ url_for('static', filename='images/' ~ monster['id'] ~ '.jpg')}}"
  alt="{{monster['navn'] }}">
  </a>

  <p>
    <a href="{{ url_for('monster_info', smak=monster['navn']) }}">{{ monster["navn"] }}</a>
  </p>
    
  </div>
  {% endfor %}
</div>
</div>
{% endblock %}
